<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <!-- Leaflet Marker Cluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <!-- Your stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header id="title" class="top-banner">
        <label for="citySelect">City:</label>
        <select id="citySelect" name="citySelect">
            <option value="New York City">New York City, USA</option>
            <option value="Indianapolis">Indianapolis, USA</option>
            <option value="Rochester">Rochester, USA</option>
            <option value="Paris">Paris, France</option>
            <option value="Bitola">Bitola, North Macedonia</option>
        </select>

        <label for="yearSelect">Year:</label>
        <select id="yearSelect">
            <option value="">Select a City First</option>
        </select>
        <p id="project-title">Monastir Mapping Project</p>
    </header>

    <div id="map"></div>

    <div id="sidepanel">
        <button id="closepanel" class="close-btn">&times;</button>
        <div id="sidepanelcontent">
            <h2>Address Details</h2>
            <p>Select an address marker to view detailed information.</p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>

    <!-- Leaflet Marker Cluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <!-- Load Local SQL.js Library BEFORE main.js -->
    <script src="lib/sql-wasm.js"></script>

    <!-- Your JavaScript -->
    <script src="src/main.js"></script>

</body>
</html>
